# SPDX-License-Identifier: MPL-2.0
#
# Cerro Torre manifest for Contractiles .ctp bundle
#
# This manifest describes the container image for verified
# container packaging. Used by `ct pack` to create .ctp bundles.

[metadata]
name = "{{SERVICE_NAME}}"
version = "0.1.0"
revision = 1
summary = "Normative constraint set-points for the A2ML/K9 ecosystem: the six-verb contractile vocabulary (intend / must / trust / adjust / dust / bust) expressing what should be true, as the counterpart to the descriptive "descriptiles" reading of what is true."
description = """
Contractiles — containerised service packaged as a verified
cerro-torre .ctp bundle with Ed25519 signing and full provenance
tracking.
"""
license = "MPL-2.0"
homepage = "https://github.com/hyperpolymath/contractiles"
maintainer = "Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"

[provenance]
upstream = "https://github.com/hyperpolymath/contractiles"
import_date = 2026-07-27T00:00:00Z

[dependencies]
runtime = ["ca-certificates", "curl"]
build = []

[build]
system = "podman"

[build.environment]
APP_HOST = "[::]"
APP_PORT = "{{PORT}}"

[outputs]
primary = "{{SERVICE_NAME}}"
split = []

[attestations]
require = ["source-signature", "sbom-complete"]
recommend = ["security-audit", "reproducible-build"]

# Runtime security profile
[security]
user = "appuser"
group = "appuser"
read_only_root = false
no_new_privileges = true

[security.capabilities]
drop = ["ALL"]
add = ["NET_BIND_SERVICE"]

[security.network]
listen_tcp = [{{PORT}}]

[security.filesystem]
read = ["/app/", "/data/"]
write = ["/data/", "/tmp/"]
execute = ["/app/entrypoint.sh"]
